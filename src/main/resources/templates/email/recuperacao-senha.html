<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="font-family: Arial, sans-serif; color: #333">
    <h2 style="color: #2c7a7b">Recuperação de Senha - QuickCare</h2>
    <p>Olá, <strong th:text="${nome}">Nome</strong>!</p>
    <p>Você solicitou a recuperação de senha. Use o código abaixo:</p>
    <h1
      style="
        letter-spacing: 4px;
        background: #f0f0f0;
        padding: 12px 20px;
        display: inline-block;
        border-radius: 6px;
      "
      th:text="${token}"
    >
      000000
    </h1>
    <p>
      Este código expira em
      <strong th:text="${validadeHoras}">1</strong> hora(s).
    </p>
    <p style="color: #888; font-size: 13px">
      Se você não solicitou essa recuperação, ignore este e-mail.
    </p>
  </body>
</html>
