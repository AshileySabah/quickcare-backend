spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:quickcare}
    username: ${POSTGRES_USER:quickcare}
    password: ${POSTGRES_PASSWORD:quickcare}
  jpa:
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:quickcare}
  secret-key: ${MINIO_ROOT_PASSWORD:quickcare123}

logging:
  level:
    com.quickcare.backend: DEBUG
