spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:quickcare}
    username: ${POSTGRES_USER:quickcare}
    password: ${POSTGRES_PASSWORD:quickcare}
  jpa:
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

supabase:
  storage:
    url: ${SUPABASE_URL}
    api-key: ${SUPABASE_SECRET_KEY}
    bucket: ${SUPABASE_BUCKET:quickcare-bucket-prod}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.quickcare.backend: DEBUG
