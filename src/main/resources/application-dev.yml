spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:quickcare}
    username: ${POSTGRES_USER:quickcare}
    password: ${POSTGRES_PASSWORD:quickcare}
  jpa:
    show-sql: true
  flyway:
    # db/seed-dev: massa de dados local (paciente de teste etc.), só no perfil dev.
    locations: classpath:db/migration,classpath:db/seed-dev

supabase:
  storage:
    url: ${SUPABASE_URL}
    api-key: ${SUPABASE_SECRET_KEY}
    bucket: ${SUPABASE_BUCKET:quickcare-bucket-prod}

logging:
  level:
    com.quickcare.backend: DEBUG
