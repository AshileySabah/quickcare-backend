spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

supabase:
  storage:
    url: ${SUPABASE_URL}
    api-key: ${SUPABASE_SECRET_KEY}
    bucket: ${SUPABASE_BUCKET:quickcare-bucket-prod}

logging:
  level:
    com.quickcare.backend: INFO
