spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # O pooler do Supabase na porta 6543 (modo transaction) não suporta
        # prepared statements nomeados no servidor: sem isso o driver colide
        # com "prepared statement S_n already exists" (inclusive no Flyway).
        prepareThreshold: 0
  jpa:
    show-sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

supabase:
  storage:
    url: ${SUPABASE_URL}
    api-key: ${SUPABASE_SECRET_KEY}
    bucket: ${SUPABASE_BUCKET:quickcare-bucket-prod}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.quickcare.backend: INFO
