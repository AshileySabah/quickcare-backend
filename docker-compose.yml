services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quickcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickcare}
      POSTGRES_USER: ${POSTGRES_USER:-quickcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcare}
    ports:
      - "5432:5432"
    volumes:
      - quickcare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickcare} -d ${POSTGRES_DB:-quickcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: quickcare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quickcare}
      POSTGRES_USER: ${POSTGRES_USER:-quickcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcare}
      # Sem Supabase configurado no .env, o back sobe normalmente; só o upload
      # de documentos/avatar no cadastro é que falha.
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-dev}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-quickcare-bucket-prod}
      EMAIL_APP: ${EMAIL_APP:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  quickcare-postgres-data:
