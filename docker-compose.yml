services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quickcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickcare}
      POSTGRES_USER: ${POSTGRES_USER:-quickcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcare}
    ports:
      - "5432:5432"
    volumes:
      - quickcare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickcare} -d ${POSTGRES_DB:-quickcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: quickcare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quickcare}
      POSTGRES_USER: ${POSTGRES_USER:-quickcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcare}
      # Sem Supabase configurado no .env, o back sobe normalmente; só o upload
      # de documentos/avatar no cadastro é que falha.
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-dev}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-quickcare-bucket-prod}
      EMAIL_APP: ${EMAIL_APP:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      QUICKCARE_STORAGE_TIPO: ${STORAGE_TIPO:-local}
      QUICKCARE_STORAGE_LOCAL_DIRETORIO: /app/arquivos
      QUICKCARE_STORAGE_LOCAL_URL_BASE: http://localhost:8080
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      QUICKCARE_EMAIL_REMETENTE: ${EMAIL_REMETENTE:-nao-responda@quickcare.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_CPF: ${ADMIN_CPF:-}
    volumes:
      - quickcare-arquivos:/app/arquivos
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: quickcare-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: ../quickcare-frontend
    container_name: quickcare-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  quickcare-postgres-data:
  quickcare-arquivos:
